<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#060810">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Student Portal Login & Register | JUT ECE Virtual Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <style>
        :root {
            --bg-void: #060810;
            --bg-card: rgba(13, 17, 23, 0.88);
            --border-glow: rgba(0, 212, 255, 0.3);
            --cyan: #00d4ff;
            --green: #00ff88;
            --amber: #ffb700;
            --purple: #a855f7;
            --text-main: #f0f4f8;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-void);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 212, 255, 0.08), transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(168, 85, 247, 0.08), transparent 35%);
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.6);
            backdrop-filter: blur(16px);
            animation: fadeIn .4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }
        .auth-logo span { color: var(--cyan); text-shadow: 0 0 12px var(--cyan); }
        
        .auth-sub {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        /* Tabs */
        .auth-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: rgba(0,0,0,0.4);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .auth-tab {
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all .2s;
        }
        .auth-tab.active {
            background: var(--cyan);
            color: #000;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(0,212,255,0.3);
        }

        /* Form Controls */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }
        .form-group label {
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .form-input, select {
            padding: 12px 14px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px; /* Prevents auto-zoom on iOS */
            outline: none;
            transition: all .2s;
        }
        .form-input:focus, select:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 12px rgba(0,212,255,0.25);
        }
        select option { background: #0d1117; color: #fff; }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            border: none;
            border-radius: 10px;
            color: #000;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0,212,255,0.4);
        }

        .auth-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }
        .auth-footer a {
            color: var(--cyan);
            text-decoration: none;
            font-weight: 600;
        }

        .toast {
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            display: none;
        }
        .toast.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444;
            display: block;
        }
        .toast.success {
            background: rgba(0, 255, 136, 0.15);
            border: 1px solid rgba(0, 255, 136, 0.4);
            color: #00ff88;
            display: block;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        
        <div class="auth-logo">
            <span>⚡</span> JUT STUDENT PORTAL
        </div>
        <p class="auth-sub">Jharkhand University of Technology &bull; ECE Lab Cloud</p>

        <div class="auth-tabs">
            <button class="auth-tab active" id="tab-signin-btn" onclick="setAuthMode('signin')">Sign In</button>
            <button class="auth-tab" id="tab-signup-btn" onclick="setAuthMode('signup')">Register (New)</button>
        </div>

        <form id="auth-form" onsubmit="handleAuthSubmit(event)">
            
            <!-- Registration Only Fields -->
            <div id="signup-fields" style="display:none;">
                <div class="form-group">
                    <label for="std-name">Student Full Name</label>
                    <input type="text" id="std-name" class="form-input" placeholder="e.g. Rahul Sharma" autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="std-roll">JUT Roll Number / Reg. No.</label>
                    <input type="text" id="std-roll" class="form-input" placeholder="e.g. 22-ECE-042" inputmode="text">
                </div>

                <div class="form-group">
                    <label for="std-sem">Current Semester</label>
                    <select id="std-sem">
                        <option value="Semester 1">Semester 1 (Foundation)</option>
                        <option value="Semester 2">Semester 2 (Applied Science)</option>
                        <option value="Semester 3">Semester 3 (Circuits & Devices)</option>
                        <option value="Semester 4" selected>Semester 4 (Digital & 8085 Microprocessor)</option>
                        <option value="Semester 5">Semester 5 (Machines & Instrumentation)</option>
                        <option value="Semester 6">Semester 6 (Power Electronics & In-Plant)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="std-college">Polytechnic College / Institute</label>
                    <input type="text" id="std-college" class="form-input" placeholder="e.g. Govt. Polytechnic Ranchi">
                </div>
            </div>

            <!-- Common Email & Password -->
            <div class="form-group">
                <label for="std-email">Email Address</label>
                <input type="email" id="std-email" class="form-input" placeholder="student@jut.ac.in" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="std-pass">Password</label>
                <input type="password" id="std-pass" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-submit" id="auth-submit-btn">
                <span>⚡</span> Sign In to Lab Hub
            </button>

            <div id="auth-toast" class="toast"></div>
        </form>

        <div class="auth-footer">
            <a href="hub.html">← Back to Main Hub</a> &bull; <a href="community.html">Doubt Clearing Chat Room →</a>
        </div>
    </div>

    <script>
        let authMode = 'signin';

        function setAuthMode(mode) {
            authMode = mode;
            const signinBtn = document.getElementById('tab-signin-btn');
            const signupBtn = document.getElementById('tab-signup-btn');
            const signupFields = document.getElementById('signup-fields');
            const submitBtn = document.getElementById('auth-submit-btn');
            const toast = document.getElementById('auth-toast');
            toast.className = 'toast';
            toast.style.display = 'none';

            if (mode === 'signup') {
                signupBtn.classList.add('active');
                signinBtn.classList.remove('active');
                signupFields.style.display = 'block';
                submitBtn.innerHTML = '<span>🎓</span> Create Student Profile';
            } else {
                signinBtn.classList.add('active');
                signupBtn.classList.remove('active');
                signupFields.style.display = 'none';
                submitBtn.innerHTML = '<span>⚡</span> Sign In to Lab Hub';
            }
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('std-email').value.trim();
            const pass = document.getElementById('std-pass').value.trim();
            const toast = document.getElementById('auth-toast');
            const submitBtn = document.getElementById('auth-submit-btn');

            if (!email || !pass) {
                showToast('Please enter both email and password.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>⏳</span> Processing...';

            try {
                if (authMode === 'signup') {
                    const name = document.getElementById('std-name').value.trim() || email.split('@')[0];
                    const roll = document.getElementById('std-roll').value.trim() || 'JUT-' + Math.floor(1000+Math.random()*9000);
                    const semester = document.getElementById('std-sem').value;
                    const college = document.getElementById('std-college').value.trim() || 'JUT Polytechnic';
                    
                    const res = await StudentAuth.signUp(email, pass, { name, roll, semester, college, avatar: '🎓' });
                    showToast('🎉 Account created successfully! Redirecting to Student Community...', 'success');
                    setTimeout(() => {
                        window.location.href = 'community.html';
                    }, 1200);
                } else {
                    const res = await StudentAuth.signIn(email, pass);
                    showToast('⚡ Welcome back! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'community.html';
                    }, 1000);
                }
            } catch(err) {
                showToast('Error: ' + (err.message || 'Unable to connect to Supabase database.'), 'error');
                submitBtn.disabled = false;
                setAuthMode(authMode);
            }
        }

        function showToast(msg, type) {
            const toast = document.getElementById('auth-toast');
            toast.textContent = msg;
            toast.className = 'toast ' + type;
            toast.style.display = 'block';
        }

        // Check if already signed in
        window.addEventListener('DOMContentLoaded', () => {
            const user = StudentAuth.getUser();
            if (user) {
                showToast(`Signed in as ${user.name} (${user.roll}). Redirecting to Community...`, 'success');
                setTimeout(() => {
                    window.location.href = 'community.html';
                }, 1500);
            }
        });
    </script>
    <script src="gemini-chat.js"></script>
</body>
</html>
